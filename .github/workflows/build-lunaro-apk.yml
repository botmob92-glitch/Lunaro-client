name: Build Lunaro Client APK

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "CPU type (arm64 fits nearly every phone, incl. Galaxy Note10+)"
        required: true
        default: "arm64"
        type: choice
        options: ["arm64", "arm", "all"]

env:
  UPSTREAM_REPO: https://github.com/ZalithLauncher/ZalithLauncher2
  # Exact upstream version the patch was written and checked against
  UPSTREAM_COMMIT: 57fd80ce24cb28f7d70762a703bc3bc48b708c18

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Lunaro patch
        uses: actions/checkout@v6

      - name: Fetch ZalithLauncher2 source (pinned version)
        run: |
          git clone "$UPSTREAM_REPO" upstream
          git -C upstream checkout "$UPSTREAM_COMMIT"
          git -C upstream submodule update --init --recursive

      - name: Generate Lunaro icon
        run: |
          pip install pillow
          python3 patch/make_icons.py

      - name: Apply Lunaro Client branding and theme
        run: python3 patch/apply_lunaro.py upstream

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: "on-failure"

      - name: Build APK
        working-directory: upstream
        env:
          # Add these as repository secrets (README explains how). CurseForge search/downloads need the key.
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
        run: |
          chmod +x gradlew
          ./gradlew ZalithLauncher:assembleDebug -Darch=${{ inputs.arch }}

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Lunaro-Client-apk-${{ inputs.arch }}
          path: upstream/ZalithLauncher/build/outputs/apk/debug/*.apk
